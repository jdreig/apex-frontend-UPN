<div class="loading-wrap" role="status" aria-live="polite" aria-label="Cargando…">
  <!-- Marca arriba -->
  <h1 class="loading-brand" aria-hidden="true">Apex América BPO</h1>

  <!-- Texto “Cargando” con puntos animados -->
  <p class="loading-text">
    <span class="loading-word">Cargando</span>
    <span class="loading-dots" aria-hidden="true"></span>
  </p>

  <!-- Spinner -->
  <div class="spinner-8dots" aria-hidden="true">
    <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span>
    <span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span><span style="--i:7"></span>
  </div>
</div>
